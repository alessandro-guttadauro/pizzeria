<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti - Pizzeria Da Noi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">🍕 Da Noi</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menù</a>
      <a href="contatti.html">Contatti</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Contatti e prenotazioni</h1>

    <div class="contact-grid">
      <section class="info">
        <h2>Dove siamo</h2>
        <p>Via Roma 12, 20121 Milano</p>
        <p>Tel. 02 1234567</p>
        <p>info@pizzeriadanoi.it</p>

        <h2>Orari</h2>
        <table class="hours">
          <tr><td>Lunedì</td><td>Chiuso</td></tr>
          <tr><td>Martedì - Venerdì</td><td>12:00 - 14:30 / 19:00 - 23:00</td></tr>
          <tr><td>Sabato - Domenica</td><td>19:00 - 24:00</td></tr>
        </table>
      </section>

      <section class="booking">
        <h2>Prenota un tavolo</h2>
        <form>
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Mario Rossi">

          <label for="data">Data</label>
          <input type="date" id="data" name="data">

          <label for="persone">Numero di persone</label>
          <input type="number" id="persone" name="persone" min="1" max="20" value="2">

          <label for="note">Note</label>
          <textarea id="note" name="note" rows="3" placeholder="Allergie, richieste particolari..."></textarea>

          <button type="submit" class="btn">Invia prenotazione</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Pizzeria Da Noi &middot; Via Roma 12, Milano</p>
  </footer>
</body>
</html>
